# zark — pre-commit hooks.
#
# NOTE on tooling versions: mypy, pylint and ruff are pinned both here
# (by git rev) and in pyproject.toml under [dependency-groups].dev (consumed
# by tox and CI via PEP 735). pre-commit and PEP 735 use different install
# mechanisms and cannot share a single source of truth, so when bumping a
# version in either place, also bump the matching one in the other file.
#
# NOTE on basedpyright: deliberately NOT a hook. It reports 42 findings on
# this codebase today and would block every commit. It is configured in
# pyproject.toml under [tool.pyright] and run on demand via
# `make basedpyright` / `tox -e types`; promote it here once it reaches
# zero.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: destroyed-symlinks
    -   id: detect-private-key

# Ruff replaces black, blackdoc, isort, flake8, pyupgrade and
# add-trailing-comma. Both hooks read [tool.ruff] in pyproject.toml, so the
# rules, the line length and the RUF027 preview rule need no args here.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
    -   id: ruff-check
        name: ruff (lint)
        args: [--fix]
    -   id: ruff-format
        name: ruff (format)

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.1'
    hooks:
      - id: mypy
        alias: mypy
        name: mypy

-   repo: https://github.com/pycqa/pylint
    rev: v4.0.8
    hooks:
    - id: pylint

-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
    -   id: shellcheck

-   repo: https://github.com/get-woke/woke
    rev: v0.19.0
    # add GOFLAGS="-buildvcs=false" when woke is being installed
    hooks:
    -   id: woke-from-source
        exclude: >
          (?x)(
              CHANGELOG
          )

-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
    -   id: bandit
        args: ["-r", "-lll"]

# codespell looks for KNOWN misspellings rather than validating every word
# against a dictionary, which is what makes it usable here: pylint's own
# spelling checker (--spelling-dict=en_US) reports 1335 hits on this
# codebase because it does not know rpool, bpool, zvol, dracut, syncoid or
# altroot. codespell reports one real typo and needs no system dictionary.
#
# -L is its ignore list. Every entry is a real term used in this repo, not a
# mistake, so nothing here is a file-level exclusion — new text in these
# files still gets checked:
#   anc          — the `_nearest_recursive_ancestor` local in commands/setup.py
#   ans          — the `read -r -p ... ans` shell variable in the Makefile
#   fpr          — GPG's colon-format record type, parsed by the awk in
#                  the Makefile's deb-source / deb-ppa targets
#   renderD      — the /dev/dri/renderD* DRM render nodes in commands/simulate.py
#   unparseable  — the variant spelling used in test names
#                  (test_dataset_used_bytes_unparseable and friends)
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
        args: ["-L", "anc,ans,fpr,renderD,unparseable"]
exclude: >
  (?x)(
      \.env
    | \.git
    | \.tox
    | \.venv
    | \.__pycache__
    | _build
    | build
    | dist
  )
