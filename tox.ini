# zark — tox configuration.
#
# Tox is the canonical entry point for running zark's test suite across
# every supported Python version, plus the static-analysis stack. CI uses
# matrix jobs (one Python per job) and invokes the relevant `tox -e pyXY`
# directly; local developers run `make tox` to exercise everything at once.
#
# Environments
# ────────────
#   py312, py313, py314 — run unit tests on the corresponding Python.
#                         zark has no runtime dependencies, so these envs
#                         install nothing and just invoke the test runner.
#   lint                — run mypy + pylint + ruff (lint and format check).
#                         Pinned to python3.12 so the static-analysis
#                         behaviour is independent of which Python the
#                         developer happens to have on PATH. Dev
#                         dependencies come from the
#                         [dependency-groups].dev table in pyproject.toml
#                         (PEP 735), so versions are not duplicated
#                         between tox and pyproject.
#   types               — basedpyright (see [tool.pyright] in
#                         pyproject.toml). Separate from `lint` so the
#                         fast env does not pull in an npm-backed package
#                         on every run, but in envlist, so `tox` and
#                         `make tox` do run it.
#
# Missing interpreters
# ────────────────────
# `skip_missing_interpreters = true` is the tox default; it lets `tox`
# (no args) succeed on a machine that only has, say, python3.12. Local
# developers benefit from this. CI overrides it via the matrix (each job
# only installs one Python and runs `tox -e py3X`), and `make tox` is
# explicit about wanting all three Pythons (see Makefile).
#
# The `requires = tox-uv` line below is what makes that practical: without
# it, `tox -e py314` on a machine that has no python3.14 SKIPs, and
# `make tox` (which passes --skip-missing-interpreters=false) FAILs
# outright — you had to install all three interpreters by hand via pyenv
# or deadsnakes. tox auto-provisions the plugin, and uv then downloads the
# missing CPython (python-build-standalone, no compilation) on first use.
#
# Caveat worth knowing: the interpreter uv downloads is not Ubuntu's
# python3. For zark, whose tests are stdlib-only, that makes no practical
# difference, but the distro binary itself is exercised by CI, which uses
# actions/setup-python instead.
#
# Requires tox >= 4.22 for `dependency_groups` support.

[tox]
min_version    = 4.22
requires       = tox-uv>=1.36
envlist        = py312, py313, py314, lint, types
skip_missing_interpreters = true
# zark is a portable script, not an installable Python package. Tell tox
# not to try to build/install it as a package — there's nothing to install,
# and setuptools' flat-layout autodiscovery would otherwise try to package
# `lib/`, `commands/` and `etc/` as top-level packages and fail.
no_package = true

[testenv]
description = Run zark unit tests on the selected Python version
# zark has no runtime deps; tests use stdlib only.
package = skip
# zark is a portable script — `lib/` and `commands/` are top-level
# directories at the repo root, not an installed package. Tell every
# tox environment to put the repo root on PYTHONPATH so `import lib.X`
# and `import commands.X` resolve. {toxinidir} is tox's variable for
# the directory containing tox.ini.
setenv =
    PYTHONPATH = {toxinidir}
commands =
    python tests/test_unit.py

[testenv:lint]
description = Static analysis: mypy + pylint + ruff (lint + format check)
basepython  = python3.12
package     = skip
# Pull dev tooling versions from pyproject.toml [dependency-groups].dev
# (PEP 735). This is the single source of truth for these versions; the
# duplication with .pre-commit-config.yaml is documented there.
dependency_groups =
    dev
# mypy needs MYPYPATH to find the top-level `lib/` and `commands/`
# directories (they are not installed packages); pylint and ruff use
# PYTHONPATH (inherited from [testenv] above, but set explicitly here
# because tox does not merge setenv across envs).
setenv =
    PYTHONPATH = {toxinidir}
    MYPYPATH   = {toxinidir}
# `ruff check` runs the full ruleset from pyproject.toml (RUF027 included,
# see the comment there); `ruff format --check` fails on unformatted code
# without rewriting it, which is what a gate should do.
commands =
    mypy .
    pylint lib commands tests zark
    ruff check --no-fix lib commands tests zark
    ruff format --check lib commands tests zark

[testenv:types]
description = basedpyright — strict type checking beyond mypy
basepython  = python3.12
package     = skip
dependency_groups =
    types
setenv =
    PYTHONPATH = {toxinidir}
commands =
    basedpyright --project {toxinidir}
