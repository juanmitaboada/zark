# zark - Continuous Integration.
#
# Runs on every push and pull request, and by hand (workflow_dispatch):
#
#   tests  - matrix of Python 3.12 / 3.13 / 3.14, each runs `tox -e py3X`
#            on the unit-test suite (tests/test_unit.py). Three parallel
#            jobs so a per-version regression is visible immediately.
#
#   lint   - single job pinned to Python 3.12, runs `tox -e lint`
#            (mypy + pylint + ruff check + ruff format --check) and then
#            `tox -e types` (basedpyright).
#            Versions come from pyproject.toml under [dependency-groups]
#            (PEP 735), so tox and CI share a single source of truth.
#
#   package     - builds the .deb on Ubuntu 24.04 and smoke-tests it there;
#                 on a release tag it also attaches it to the GitHub Release.
#   smoke-2604  - installs that same .deb on Ubuntu 26.04 and smoke-tests it.
#                 Both run on tags and on a manual run, so a branch can be
#                 checked on both supported series before any tag.
#
# Every job names its runner image: `ubuntu-latest` moves from 24.04 to
# 26.04 during 2026-10/11 (RELP.8), and a job must not change series by
# itself. The .deb is built on the oldest supported series, so its dpkg and
# debhelper make a package both series install.
#
# What this workflow does NOT cover
# ─────────────────────────────────
# Integration tests (`make test-real`) run zark end-to-end inside QEMU
# with OVMF firmware, real ZFS pools and an Ubuntu live ISO. They cannot
# run on GitHub-hosted runners because:
#   - GitHub-hosted runners do not provide nested KVM virtualisation.
#   - The recovery flow needs root, raw block-device access and the ZFS
#     kernel modules.
#   - The full integration test takes ~15 minutes per phase and consumes
#     several GB of disk for the QEMU images.
# Run them locally on real hardware with `sudo make test-real ISO=...`.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel an older run on the same ref when a new commit lands. Saves
# minutes and avoids piling up stale results in the PR view.
# The event is part of the group, so a manual run does not cancel a push's.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads source. No write permissions needed.
permissions:
  contents: read

jobs:

  # ── Unit tests across the supported Python matrix ────────────────────
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      # Keep every Python version running even if one fails - we want the
      # full picture of which versions break, not just the first hit.
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tests
        # tox env name has no dot: 3.12 → py312
        run: tox -e py$(echo "${{ matrix.python }}" | tr -d .)

  # ── Static analysis (mypy + pylint + ruff + basedpyright) ────────────
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run lint suite (mypy + pylint + ruff)
        run: tox -e lint

      - name: Run basedpyright
        # Separate tox env so a failure here is distinguishable in the
        # job log from a mypy/pylint/ruff failure, and so the lint env
        # stays free of the npm-backed package.
        run: tox -e types

  # ── Debian packaging smoke build (tags and manual runs) ──────────────
  #
  # Builds the .deb on release tags (vX.Y.Z) and on a manual run, uploads
  # it as a workflow artefact, and on a tag attaches it to the GitHub
  # Release. Does NOT sign and does NOT upload to the PPA - those steps
  # require the maintainer's GPG key and run locally via `make deb-ppa`.
  # See debian/README.packaging.md for the PPA flow.
  package:
    name: package (.deb)
    runs-on: ubuntu-24.04
    needs: [tests, lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # needed to attach asset to the release
    steps:
      - uses: actions/checkout@v6

      - name: Install build tooling
        # debhelper, devscripts, fakeroot, lintian: standard Debian
        # packaging stack. pandoc: needed since v1.0.6 to render the
        # zark(1) manpage from debian/zark.1.md during dh_auto_build
        # (declared in debian/control's Build-Depends; this step is
        # what satisfies that declaration on the runner).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential devscripts debhelper fakeroot lintian pandoc

      - name: Build unsigned .deb
        run: make deb

      - name: Run lintian (informational)
        # Don't fail the build on lintian warnings - the maintainer
        # reviews them locally before PPA upload. We suppress the same
        # tags as `make deb` / `make deb-source` (see Makefile's
        # LINTIAN_SUPPRESS_TAGS for the rationale): bad-distribution-
        # in-changes-file fires because the base changelog uses
        # "unstable", which is rewritten to a concrete Ubuntu series
        # only at PPA upload time (`make deb-ppa`) - never on the
        # CI-built .deb. This keeps the CI log clean while preserving
        # the warning at the moment that matters most.
        run: lintian -i --suppress-tags bad-distribution-in-changes-file ../zark_*.changes || true

      - name: Smoke test the built .deb
        # Install it, check that zark starts, purge it (.github/smoke-deb.sh,
        # which the 26.04 job runs too).
        run: .github/smoke-deb.sh ../zark_*_amd64.deb

      - name: Stage build artefacts inside the workspace
        # dpkg-buildpackage drops .deb / .changes / .buildinfo into the
        # parent directory of the source tree (Debian convention). The
        # upload-artifact and gh-release actions refuse paths containing
        # '..' for security reasons, so copy the artefacts into the
        # workspace under dist/ before publishing them.
        # `make dist` (invoked transitively by `make deb`) produces
        # zark_X.Y.Z.tar.gz in the project root - the canonical portable
        # form referenced by the README - so we stage it alongside.
        run: |
          mkdir -p dist
          cp ../zark_*_amd64.deb       dist/
          cp ../zark_*.changes       dist/ 2>/dev/null || true
          cp ../zark_*.buildinfo     dist/ 2>/dev/null || true
          cp zark_*.tar.gz           dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload .deb and tarball as workflow artefacts
        uses: actions/upload-artifact@v6
        with:
          name: zark-release-assets
          path: |
            dist/zark_*_amd64.deb
            dist/zark_*.tar.gz

      - name: Attach release assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/zark_*_amd64.deb
            dist/zark_*.tar.gz

  # ── The same .deb on Ubuntu 26.04 (RELP.8) ───────────────────────────
  #
  # Installs the package job's artefact on the newer supported series, so
  # its Depends resolve from resolute's archive and the entry point runs
  # with resolute's Python before any release.
  smoke-2604:
    name: smoke (.deb on 26.04)
    runs-on: ubuntu-26.04
    needs: [package]
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the .deb built on 24.04
        uses: actions/download-artifact@v8
        with:
          name: zark-release-assets
          path: dist

      - name: Smoke test the .deb
        run: |
          sudo apt-get update
          .github/smoke-deb.sh dist/zark_*_amd64.deb
