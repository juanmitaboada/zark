# SonarQube Cloud: read by the scan in CI (.github/workflows/ci.yml, job
# analysis). Nothing here is installed: debian/install names what is.
sonar.organization=juanmitaboada
sonar.projectKey=juanmitaboada_zark

# The whole tree is source except tests/, which is test code. coverage.xml
# is the report CI downloads into the root, not a source.
sonar.sources=.
sonar.exclusions=tests/**,coverage.xml
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The Pythons zark supports (pyproject.toml's requires-python and tox).
sonar.python.version=3.12, 3.13, 3.14

# Cobertura XML from `tox -e cov` (pytest-cov, the 3.12 tests job).
sonar.python.coverage.reportPaths=coverage.xml

# The scan does not wait for the quality gate, so a red gate fails no CI
# run. true makes the analysis job wait for the gate and fail when it is red.
sonar.qualitygate.wait=false
